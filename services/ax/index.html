<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>REIGN • UltraView AX</title>
<style>
:root{color-scheme:dark;font:15px system-ui;background:#10131b;color:#e8ecf5}
*{box-sizing:border-box}body{margin:0;padding:20px;max-width:1200px;margin:auto}
header,nav,.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}header{justify-content:space-between}
section{background:#1c2331;border:1px solid #394255;border-radius:12px;padding:18px;margin:16px 0}
button,input{font:inherit;border-radius:8px;padding:10px}button{background:#536bd8;color:white;border:0;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}
input{background:#111827;color:white;border:1px solid #59637a}#screen{display:block;width:100%;max-width:100%;aspect-ratio:8/5;object-fit:contain;background:#080a0f;border:1px solid #414b60;cursor:crosshair}
#status{min-height:24px}label{display:block;margin:8px 0}small{color:#adb8cd}
</style></head><body>
<header><h1>REIGN · UltraView AX</h1><span id="status" role="status" aria-live="polite">Sign in to begin.</span></header>
<section id="loginPanel"><h2>Sign in</h2><form id="loginForm"><label>Password <input id="password" type="password" autocomplete="current-password" required></label><button>Sign in</button></form></section>
<main id="console" hidden>
<section><div class="row"><button id="open">Open Git High</button><button id="take" disabled>Take control</button><button id="return" disabled>Return control</button><button id="close" disabled>Close session</button><button id="logout">Sign out</button></div>
<p>Session: <output id="session">None</output> · Controller: <output id="controller">—</output> · Epoch: <output id="epoch">—</output></p>
<img id="screen" alt="Live remote computer screenshot" draggable="false"><small>Screen refreshes while connected. Clicking the screen sends input only while you control it.</small></section>
<section><h2>Human input</h2><div class="row"><input id="text" aria-label="Text to type" placeholder="Type into remote computer"><button id="send" disabled>Send text</button><button id="scroll" disabled>Scroll down</button></div></section>
</main>
<script>
'use strict';
let sid=null, epoch=null, controller=null, poll=null;
const $=id=>document.getElementById(id);
const say=msg=>{$('status').textContent=msg};
function csrf(){return document.cookie.split('; ').find(x=>x.startsWith('ax_csrf='))?.slice(8)||''}
async function api(path,method='GET',body){
 const headers={};if(method!=='GET'){headers['Content-Type']='application/json';headers['X-CSRF-Token']=csrf()}
 const r=await fetch(path,{method,headers,credentials:'same-origin',body:body===undefined?undefined:JSON.stringify(body),cache:'no-store'});
 if(!r.ok)throw Error('Request failed ('+r.status+')');return r.json()
}
function refreshControls(){
 $('take').disabled=!sid||controller!=='agent';$('return').disabled=!sid||controller!=='human';
 $('close').disabled=!sid;$('send').disabled=!sid||controller!=='human';$('scroll').disabled=$('send').disabled;
 $('session').textContent=sid||'None';$('controller').textContent=controller||'—';$('epoch').textContent=epoch??'—'
}
function stop(){if(poll)clearInterval(poll);poll=null;sid=null;epoch=null;controller=null;$('screen').removeAttribute('src');refreshControls()}
async function sync(){
 if(!sid)return;
 try{
 const s=await api('/api/sessions/'+encodeURIComponent(sid));
 controller=s.control_owner??s.controller??s.mode??null;epoch=s.epoch??s.control_epoch??null;
 refreshControls();
 $('screen').src='/api/sessions/'+encodeURIComponent(sid)+'/frame?t='+Date.now();
 }catch(e){say('Connection lost: '+e.message);if(poll)clearInterval(poll);poll=null;refreshControls()}
}
async function run(fn){try{await fn()}catch(e){say(e.message)}}
$('loginForm').onsubmit=e=>{e.preventDefault();run(async()=>{await api('/login','POST',{password:$('password').value});$('password').value='';$('loginPanel').hidden=true;$('console').hidden=false;say('Authenticated')})};
$('open').onclick=()=>run(async()=>{stop();const s=await api('/api/sessions','POST',{url:'https://alambda-forge.onrender.com/'});sid=s.id??s.session_id;if(!sid)throw Error('Core returned no session ID');say('Session opened');await sync();poll=setInterval(sync,1500)});
async function change(mode){const s=await api('/api/sessions/'+encodeURIComponent(sid)+'/control','POST',{mode,epoch});controller=s.control_owner??s.mode??mode;epoch=s.epoch??epoch;refreshControls();say('Control: '+controller)}
$('take').onclick=()=>run(()=>change('human'));$('return').onclick=()=>run(()=>change('agent'));
async function input(data){await api('/api/sessions/'+encodeURIComponent(sid)+'/input','POST',{epoch,...data});await sync()}
$('screen').onclick=e=>run(async()=>{if(controller!=='human')return;const r=e.currentTarget.getBoundingClientRect();await input({kind:'click',x:Math.max(0,Math.min(1279,(e.clientX-r.left)*1280/r.width)),y:Math.max(0,Math.min(799,(e.clientY-r.top)*800/r.height))})});
$('send').onclick=()=>run(()=>input({kind:'text',text:$('text').value}));
$('scroll').onclick=()=>run(()=>input({kind:'scroll',dy:450}));
$('close').onclick=()=>run(async()=>{await api('/api/sessions/'+encodeURIComponent(sid),'DELETE');stop();say('Session closed')});
$('logout').onclick=()=>run(async()=>{await api('/logout','POST');stop();$('console').hidden=true;$('loginPanel').hidden=false;say('Signed out')});
</script></body></html>
