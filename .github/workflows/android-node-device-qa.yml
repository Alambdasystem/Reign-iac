name: Android node on-device verification
on:
  push:
    branches: [test/android-node-offline-device]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare Android 15 hardware-accelerated emulator and Gradle
        run: |
          set -euo pipefail
          sudo setfacl -m "u:$USER:rw" /dev/kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" "system-images;android-35;google_apis;x86_64"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd -f -n reign-phone -k "system-images;android-35;google_apis;x86_64"
          curl -sfL --retry 2 https://services.gradle.org/distributions/gradle-8.14.3-bin.zip -o /tmp/gradle.zip
          echo 'bd71102213493060956ec229d946beee57158dbd89d0e62b91bca0fa2c5f3531  /tmp/gradle.zip' | sha256sum -c -
          unzip -q /tmp/gradle.zip -d /tmp/reign-gradle
      - name: Build the phone app and the same-signature test driver
        run: |
          python3 mobile/android/prepare_assets.py
          /tmp/reign-gradle/gradle-8.14.3/bin/gradle -p mobile/android assembleDebug
          /tmp/reign-gradle/gradle-8.14.3/bin/gradle -p mobile/device-probe assembleDebug
      - name: Load the bundled model and answer in airplane mode
        run: |
          set -euo pipefail
          "$ANDROID_HOME/emulator/emulator" -avd reign-phone -accel on -memory 3500 -cores 2 -no-window -no-audio -no-snapshot -gpu swiftshader_indirect -no-boot-anim > /tmp/emulator.log 2>&1 &
          emupid=$!
          trap 'kill "$emupid" || true' EXIT
          timeout 300 bash -c 'until adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r" | grep -qx 1; do sleep 2; done'
          adb shell input keyevent 82
          adb install --no-incremental mobile/android/build/outputs/apk/debug/ReignNode-debug.apk
          adb install --no-incremental mobile/device-probe/build/outputs/apk/debug/ReignNode-debug.apk
          adb shell cmd connectivity airplane-mode enable
          test "$(adb shell settings get global airplane_mode_on | tr -d '\r')" = 1
          timeout 450 adb shell am instrument -w systems.alambda.reignprobe/.Probe | tee /tmp/inference.log
          if ! grep -q 'Android local inference passed' /tmp/inference.log; then
            adb logcat -d -s chromium:W AndroidRuntime:E | tail -80
            exit 1
          fi
