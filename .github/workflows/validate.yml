name: Validate REIGN infrastructure
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  infrastructure:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f
        with:
          tofu_version: 1.13.0
          tofu_wrapper: false
      - run: tofu -chdir=infra/render fmt -check -recursive
      - run: tofu -chdir=infra/render init -backend=false -input=false -lockfile=readonly
      - run: tofu -chdir=infra/render validate -no-color
      - run: tofu -chdir=infra/render test -no-color
      - run: test ! -f infra/render/errored_test.tfstate
      - run: python3 -m compileall -q reign scripts
  containers:
    needs: infrastructure
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: docker build --platform linux/amd64 -f services/temporal/Dockerfile -t reign-temporal:ci .
      - run: docker build --platform linux/amd64 -f services/computer/Dockerfile -t reign-computer:ci .
      - run: bash scripts/container_smoke.sh
