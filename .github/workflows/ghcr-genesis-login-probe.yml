name: Read-only Genesis login AX release verification
on:
  pull_request:
    paths: [.github/workflows/ghcr-genesis-login-probe.yml]
permissions:
  contents: read
  packages: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      SOURCE_SHA: 571c300d411f5aa340b48ee1a109c56558caccb5
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify main remains exact
        run: |
          set -euo pipefail
          actual="$(gh api repos/$GITHUB_REPOSITORY/branches/main --jq .commit.sha)"
          test "$actual" = "$SOURCE_SHA" || { echo "::error::Main changed"; exit 1; }
      - name: Verify immutable GHCR AX digest
        run: |
          set -euo pipefail
          image="ghcr.io/alambdasystem/reign-ax:$SOURCE_SHA"
          output="$(docker buildx imagetools inspect "$image")" || {
            echo "::error::No published tested AX image"; exit 1;
          }
          digest="$(printf '%s\n' "$output" | awk '$1=="Digest:" {print $2; exit}')"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || exit 1
          echo "VERIFIED_AX_IMAGE=ghcr.io/alambdasystem/reign-ax@$digest"
      - name: Verify successful gated main publication artifact
        run: |
          set -euo pipefail
          found=false
          for run in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/reign-cd.yml/runs?per_page=30" --jq '.workflow_runs[] | select(.conclusion=="success") | .id'); do
            artifact="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts?per_page=100" --jq ".artifacts[] | select(.name==\"tested-release-$SOURCE_SHA\" and .expired==false) | .id" | head -n 1)"
            if [[ -n "$artifact" ]]; then
              echo "VERIFIED_RELEASE_RUN=https://github.com/$GITHUB_REPOSITORY/actions/runs/$run"
              echo "VERIFIED_ARTIFACT_ID=$artifact"
              found=true
              break
            fi
          done
          [[ "$found" == true ]] || { echo "::error::Missing success receipt"; exit 1; }
