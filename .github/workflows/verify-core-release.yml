name: Verify existing REIGN Core GHCR release digest
on:
  pull_request:
    paths:
      - '.github/workflows/verify-core-release.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    steps:
      - name: Inspect immutable main release image (no deployment)
        env:
          GHCR_TOKEN: ${{ github.token }}
          SOURCE_SHA: 80ab84fc028ee3d0c3d09b77e9f419c66b42f451
        run: |
          set -euo pipefail
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
          image="ghcr.io/alambdasystem/reign-core:$SOURCE_SHA"
          echo "Checking image: $image"
          docker buildx imagetools inspect "$image"
          echo "This check only confirms registry availability and its digest; it does not prove deployment."
