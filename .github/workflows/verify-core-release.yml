name: Verify existing REIGN Core GHCR release digest
on:
  pull_request:
    paths:
      - '.github/workflows/verify-core-release.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    steps:
      - name: Inspect immutable main release image (no deployment)
        env:
          GHCR_TOKEN: ${{ github.token }}
          SOURCE_SHA: ae9611af2cf2a206eb2f3d1d12b3655f2ad8a318
        run: |
          set -euo pipefail
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin >/dev/null
          for service in core ax computer temporal; do
            image="ghcr.io/alambdasystem/reign-$service:$SOURCE_SHA"
            echo "Checking image: $image"
            docker buildx imagetools inspect "$image"
          done
          echo "All four release tags exist; no deployment was performed."
