name: REIGN application validation
on:
  push:
    branches: [main, feat/configurable-computer-profiles]
  pull_request:
    paths:
      - 'reign/**'
      - 'services/**'
      - 'tests/**'
      - 'migrations/**'
      - 'scripts/**'
      - '.github/workflows/reign-app.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            services/core/requirements.txt
            services/computer/requirements.txt
            services/ax/requirements.txt
      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/core/requirements.txt -r services/computer/requirements.txt -r services/ax/requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q reign tests
      - name: Run regression tests
        run: python -m unittest discover -s tests -v

  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        service: [core, ax, computer, temporal]
    steps:
      - uses: actions/checkout@v4
      - name: Build service container
        run: docker build --platform linux/amd64 -f services/${{ matrix.service }}/Dockerfile -t reign-${{ matrix.service }}:ci .

  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [python-tests, container-build]
    steps:
      - uses: actions/checkout@v4
      - name: Build Temporal and Computer images for integration smoke
        run: |
          docker build --platform linux/amd64 -f services/temporal/Dockerfile -t reign-temporal:ci .
          docker build --platform linux/amd64 -f services/computer/Dockerfile -t reign-computer:ci .
      - name: Verify Temporal, authenticated worker, and Chromium screenshot
        run: bash scripts/container_smoke.sh
