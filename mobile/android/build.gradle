buildscript {
    repositories { google(); mavenCentral() }
    dependencies { classpath 'com.android.tools.build:gradle:8.13.0' }
}
apply plugin: 'com.android.application'

android {
    namespace 'systems.alambda.reignnode'
    compileSdk 36
    defaultConfig {
        applicationId 'systems.alambda.reignnode'
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }
    androidResources { noCompress += ['gguf', 'wasm'] }
    sourceSets.main.assets.srcDirs += ['generated-assets']
}
tasks.named('preBuild').configure {
    doFirst {
        if (!file('generated-assets/model.gguf').exists()) {
            throw new GradleException('Run python3 prepare_assets.py before building.')
        }
    }
}
