services:
  - type: web
    name: reign-meetings
    runtime: python
    region: ohio
    plan: free
    numInstances: 1
    buildCommand: pip install -r meeting_service/requirements.txt && python -m unittest meeting_service.test_app
    startCommand: uvicorn meeting_service.app:app --host 0.0.0.0 --port $PORT --no-access-log
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2
      - key: MEETING_MODEL
        value: gpt-6-luna
      - key: OPENAI_API_KEY
        fromService:
          type: web
          name: workmates-api
          envVarKey: OPENAI_API_KEY
      - key: MEETING_TOKEN
        sync: false
