# Approved pilot: Render Blueprint is the single infrastructure owner.
# Keep the existing Blueprint and autoSync=false. No unrelated resources adopted.
# Vault disk activation requires the concrete scope/cost approval in AGENTS.md.
previews:
  generation: 'off'
services:
- type: pserv
  name: reign-temporal-pilot
  runtime: image
  plan: 1c-2g
  region: oregon
  numInstances: 1
  image:
    url: ghcr.io/alambdasystem/reign-temporal@sha256:afbae0626e74adbb7f1b4fab54b11342bc11af12df184b0847a5d6c55089aeb4
  envVars:
  - key: PORT
    value: '7233'
  disk:
    name: reign-temporal-data
    mountPath: /data
    sizeGB: 1
- type: pserv
  name: reign-computer-pilot
  runtime: image
  plan: 1c-2g
  region: oregon
  numInstances: 1
  image:
    url: ghcr.io/alambdasystem/reign-computer@sha256:97ce9f567da44aa65069e3a442754b4fa93a61bc3a5d19051911d25c0eb5b5c1
  envVars:
  - key: PORT
    value: '10000'
  - key: TEMPORAL_HOST
    fromService:
      name: reign-temporal-pilot
      type: pserv
      property: host
  - key: TEMPORAL_NAMESPACE
    value: default
  - key: TEMPORAL_TASK_QUEUE
    value: reign-computer
  - key: ALLOWED_HOSTS
    value: alambda-forge.onrender.com
  - key: COMPUTER_TOKEN
    generateValue: true
  - key: MAX_SESSIONS
    value: '1'
  - key: CORE_HOST
    fromService:
      name: reign-core-pilot
      type: pserv
      property: host
  - key: CREDENTIAL_CHANNEL_KEY
    fromService:
      name: reign-core-pilot
      type: pserv
      envVarKey: CREDENTIAL_CHANNEL_KEY
  # Clear the failed override; the image CMD and TEMPORAL_HOST fallback suffice.
  dockerCommand: ''
- type: pserv
  name: reign-core-pilot
  runtime: image
  plan: 0.5c-512mb
  region: oregon
  numInstances: 1
  image:
    url: ghcr.io/alambdasystem/reign-core@sha256:60b7a1e6b5ff21972ffb54f4c5c332f97d8d533db18c1badb1c1bf923df037cf
  envVars:
  - key: PORT
    value: '10000'
  - key: TEMPORAL_HOST
    fromService:
      name: reign-temporal-pilot
      type: pserv
      property: host
  - key: TEMPORAL_NAMESPACE
    value: default
  - key: TEMPORAL_TASK_QUEUE
    value: reign-computer
  - key: ALLOWED_HOSTS
    value: alambda-forge.onrender.com
  - key: COMPUTER_HOST
    fromService:
      name: reign-computer-pilot
      type: pserv
      property: host
  - key: COMPUTER_TOKEN
    fromService:
      name: reign-computer-pilot
      type: pserv
      envVarKey: COMPUTER_TOKEN
  - key: CORE_TOKEN
    generateValue: true
  # Read existing Workmates configuration without exposing or copying secret values.
  - key: OPENAI_API_KEY
    fromService:
      name: workmates-api
      type: web
      envVarKey: OPENAI_API_KEY
  - key: OPENAI_MODEL
    fromService:
      name: workmates-api
      type: web
      envVarKey: OPENAI_MODEL
  - key: REIGN_VAULT_DIR
    value: /var/data/reign-vault
  - key: REIGN_VAULT_KEY
    generateValue: true
  # Existing private Core mount stores encrypted transcript records. The
  # Render generates/preserves a random 256-bit key; no secret enters Git.
  - key: REIGN_HISTORY_MODE
    value: disk
  - key: REIGN_HISTORY_KEY
    generateValue: true
  # Draft-only single-admin Genesis registry. No agent execution, credentials,
  # provider provisioning, external IAM, or paid resources.
  - key: GENESIS_DRAFT_MODE
    value: enabled
  # Core disk-backed node inventory only; no new workers or live dispatch.
  - key: REIGN_NODES_MODE
    value: inventory
  # Shared rooms, employee access and documents use the existing private disk.
  - key: REIGN_TEAM_MODE
    value: disk
  - key: CREDENTIAL_CHANNEL_KEY
    generateValue: true
  # Core derives both private endpoints from the referenced host variables.
  dockerCommand: ''
  # Predeploy has no mounted disk. Require private voice/graph acceptance,
  # the live scoped-worker protocol, and synthetic team vision/document/speech.
  # Only this verification process disables disk features; runtime stays durable.
  preDeployCommand: env REIGN_HISTORY_MODE=disabled GENESIS_DRAFT_MODE=disabled REIGN_NODES_MODE=disabled REIGN_TEAM_MODE=disabled python -m reign.release_acceptance
  disk:
    name: reign-account-vault
    mountPath: /var/data/reign-vault
    sizeGB: 1
- type: web
  name: reign-ax-pilot
  runtime: image
  plan: 0.5c-512mb
  region: oregon
  numInstances: 1
  image:
    url: ghcr.io/alambdasystem/reign-ax@sha256:dda4c788a316a050bf513b3eb80e95212b2905175dfb32ecb02b632809a3ee4b
  envVars:
  - key: PORT
    value: '10000'
  - key: CORE_HOST
    fromService:
      name: reign-core-pilot
      type: pserv
      property: host
  - key: CORE_TOKEN
    fromService:
      name: reign-core-pilot
      type: pserv
      envVarKey: CORE_TOKEN
  - key: AX_SESSION_KEY
    generateValue: true
  - key: AX_ADMIN_PASSWORD
    generateValue: true
  - key: AX_AVATAR_USERS_JSON
    sync: false
  - key: AX_PUBLIC_ORIGIN
    fromService:
      name: reign-ax-pilot
      type: web
      envVarKey: RENDER_EXTERNAL_URL
  - key: AX_ALLOW_INTERNAL_HTTP
    value: '1'
  - key: AX_TEAM_ENABLED
    value: '1'
  # Render passes the remainder after /bin/sh -c as one shell program. Do not
  # quote that entire program as in a local terminal command.
  dockerCommand: /bin/sh -c export CORE_URL="http://${CORE_HOST}:10000"; exec uvicorn reign.ax:app --host 0.0.0.0 --port "${PORT:-10000}"
  healthCheckPath: /healthz
