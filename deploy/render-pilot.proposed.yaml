# Approved pilot: Render Blueprint is the single infrastructure owner.
# Keep the existing Blueprint and autoSync=false. No unrelated resources adopted.
# Vault disk activation requires the concrete scope/cost approval in AGENTS.md.
previews:
  generation: 'off'
services:
- type: pserv
  name: reign-temporal-pilot
  runtime: image
  plan: 1c-2g
  region: oregon
  numInstances: 1
  image:
    url: ghcr.io/alambdasystem/reign-temporal@sha256:afbae0626e74adbb7f1b4fab54b11342bc11af12df184b0847a5d6c55089aeb4
  envVars:
  - key: PORT
    value: '7233'
  disk:
    name: reign-temporal-data
    mountPath: /data
    sizeGB: 1
- type: pserv
  name: reign-computer-pilot
  runtime: image
  plan: 1c-2g
  region: oregon
  numInstances: 1
  image:
    url: ghcr.io/alambdasystem/reign-computer@sha256:b2dbbefe732e56d2526391dcb9116051c3c10f5bc674e3751f91ebc1f0128faa
  envVars:
  - key: PORT
    value: '10000'
  - key: TEMPORAL_HOST
    fromService:
      name: reign-temporal-pilot
      type: pserv
      property: host
  - key: TEMPORAL_NAMESPACE
    value: default
  - key: TEMPORAL_TASK_QUEUE
    value: reign-computer
  - key: ALLOWED_HOSTS
    value: alambda-forge.onrender.com
  - key: COMPUTER_TOKEN
    generateValue: true
  - key: MAX_SESSIONS
    value: '1'
  - key: CORE_HOST
    fromService:
      name: reign-core-pilot
      type: pserv
      property: host
  - key: CREDENTIAL_CHANNEL_KEY
    fromService:
      name: reign-core-pilot
      type: pserv
      envVarKey: CREDENTIAL_CHANNEL_KEY
  # Clear the failed override; the image CMD and TEMPORAL_HOST fallback suffice.
  dockerCommand: ''
- type: pserv
  name: reign-core-pilot
  runtime: image
  plan: 0.5c-512mb
  region: oregon
  numInstances: 1
  image:
    url: ghcr.io/alambdasystem/reign-core@sha256:88df97143dfdea2796dd9035a54cec7fe0defbbfdee3a7f55cdd4ed4ad9e8046
  envVars:
  - key: PORT
    value: '10000'
  - key: TEMPORAL_HOST
    fromService:
      name: reign-temporal-pilot
      type: pserv
      property: host
  - key: TEMPORAL_NAMESPACE
    value: default
  - key: TEMPORAL_TASK_QUEUE
    value: reign-computer
  - key: ALLOWED_HOSTS
    value: alambda-forge.onrender.com
  - key: COMPUTER_HOST
    fromService:
      name: reign-computer-pilot
      type: pserv
      property: host
  - key: COMPUTER_TOKEN
    fromService:
      name: reign-computer-pilot
      type: pserv
      envVarKey: COMPUTER_TOKEN
  - key: CORE_TOKEN
    generateValue: true
  # Read existing Workmates configuration without exposing or copying secret values.
  - key: OPENAI_API_KEY
    fromService:
      name: workmates-api
      type: web
      envVarKey: OPENAI_API_KEY
  - key: OPENAI_MODEL
    fromService:
      name: workmates-api
      type: web
      envVarKey: OPENAI_MODEL
  - key: REIGN_VAULT_DIR
    value: /var/data/reign-vault
  - key: REIGN_VAULT_KEY
    generateValue: true
  - key: CREDENTIAL_CHANNEL_KEY
    generateValue: true
  # Core derives both private endpoints from the referenced host variables.
  dockerCommand: ''
  # Block promotion unless real provider speech reaches the LangGraph status
  # tool and returns non-silent audio. Synthetic input; no device-audio claim.
  preDeployCommand: python -m reign.voice_acceptance
  disk:
    name: reign-account-vault
    mountPath: /var/data/reign-vault
    sizeGB: 1
- type: web
  name: reign-ax-pilot
  runtime: image
  plan: 0.5c-512mb
  region: oregon
  numInstances: 1
  image:
    url: ghcr.io/alambdasystem/reign-ax@sha256:86a2805e6f07da294c084fd994d4f3b7a662b91cad4ce88a599f9e46dfd73ba1
  envVars:
  - key: PORT
    value: '10000'
  - key: CORE_HOST
    fromService:
      name: reign-core-pilot
      type: pserv
      property: host
  - key: CORE_TOKEN
    fromService:
      name: reign-core-pilot
      type: pserv
      envVarKey: CORE_TOKEN
  - key: AX_SESSION_KEY
    generateValue: true
  - key: AX_ADMIN_PASSWORD
    generateValue: true
  - key: AX_PUBLIC_ORIGIN
    fromService:
      name: reign-ax-pilot
      type: web
      envVarKey: RENDER_EXTERNAL_URL
  - key: AX_ALLOW_INTERNAL_HTTP
    value: '1'
  # Render passes the remainder after /bin/sh -c as one shell program. Do not
  # quote that entire program as in a local terminal command.
  dockerCommand: /bin/sh -c export CORE_URL="http://${CORE_HOST}:10000"; exec uvicorn reign.ax:app --host 0.0.0.0 --port "${PORT:-10000}"
  healthCheckPath: /healthz
